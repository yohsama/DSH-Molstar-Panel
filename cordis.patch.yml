# DSH Mol* Panel bundle patch.
#
# - inserts the plugin row (Host tool + bridge, Client preview)
# - targets the workspace-files row by id to raise its complete-file byte cap
#   (DSH default 32 MiB) to 4 GiB, so large structures and trajectories open
#   in the panel (browser memory becomes the practical limit; trajectory
#   windows still read through byte ranges). A null here means "fall back to
#   the default", so an explicit integer is required.
- insert:
    - id: molstar-preview
      name: dsh-molstar-preview
- id: workspace-files
  config:
    maxFileBytes: 4294967296
